name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    uses: Sagargupta16/shared-workflows/.github/workflows/python-ci.yml@main
    with:
      working-directory: backend
  security:
    uses: Sagargupta16/shared-workflows/.github/workflows/security-scan.yml@main
    permissions:
      contents: read
      security-events: write
